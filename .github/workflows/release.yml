name: release

# vX.Y.Z タグを push すると発火。ビルド→GitHub Release 添付は常時。
# PyPI / Docker Hub への公開は、設定が済むまで誤爆しないよう
# リポジトリ変数(Settings > Variables)でゲートする:
#   ENABLE_PYPI   = "true"  → PyPI へ公開(要: PyPI Trusted Publisher 設定)
#   ENABLE_DOCKER = "true"  → Docker Hub へ公開(要: secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, vars DOCKER_IMAGE)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write      # GitHub Release 作成
  id-token: write      # PyPI Trusted Publishing(OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Verify version matches the tag
        run: |
          PKG=$(python -c "import re;print(re.search(r'(?m)^\s*version\s*=\s*\"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || (echo "::error::pyproject version ($PKG) != tag ($TAG)" && exit 1)
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

  pypi:
    needs: build
    if: vars.ENABLE_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    if: vars.ENABLE_DOCKER == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
