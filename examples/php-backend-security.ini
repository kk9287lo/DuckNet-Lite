; Backend PHP configuration, not a DuckNet runtime dependency.
; Apply to an updated, vendor-supported PHP runtime and restart its workers.
; These settings do not repair PHP2Shell's memory-safety vulnerabilities.
; Do not rely on a gateway or this file instead of installing PHP security fixes.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off

; Disable upload-progress state when the application does not need it.
; This is defense in depth, not a substitute for the PHP security update.
session.upload_progress.enabled = Off
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.cookie_samesite = Lax
